[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathprobe"
version = "0.3.0"
description = "Диагностика блокировок destinations (DNS/TCP/TLS/HTTP) и опционально своих peers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.1",
  "dnspython>=2.6.1",
  "click>=8.1.7",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2.0"]
dev = ["pytest>=8.0"]
build-exe = ["customtkinter>=5.2.0", "pyinstaller>=6.0"]

[project.scripts]
pathprobe = "pathprobe.cli:main"
pathprobe-gui = "pathprobe.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pathprobe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
