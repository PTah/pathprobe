# Pathprobe — пример конфига.
#
# Основной режим (CircumVolve-стиль): destinations — «почему не открывается сайт».
# Опционально peers — диагностика своего туннель-peer (MikroTik/VPS).

meta:
  report_language: ru
  run_role: office-or-home

# Локальные DNS (офис: DC). С них спрашиваем цель — как видит ваша сеть.
local_dns:
  resolvers:
    - "10.0.0.1"
    - "10.0.0.1"

# Эталонные DNS (публичные) — «как должно быть в мире».
control_dns:
  resolvers:
    - "1.1.1.1"
    - "8.8.8.8"

# Цели для диагностики блокировок
destinations:
  - id: canva
    host: "www.canva.com"
    ports: [443]
    http: true
  # - id: example
  #   host: "example.com"
  #   ports: [443]
  #   http: true

timeouts:
  dns_sec: 3.0
  tcp_sec: 5.0
  tls_sec: 8.0
  http_sec: 10.0
  udp_sec: 3.0
  mtu_sec: 3.0

